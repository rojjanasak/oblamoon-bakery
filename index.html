<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Ob-la-moon</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; background:#FBF3E7; color:#3D2B1F; text-align:center; }
  .box{ padding:32px; }
  .mark{ font-size:3rem; }
  h1{ font-size:1.3rem; margin:12px 0 6px; }
  p{ color:#6B5644; font-size:.9rem; }
  button{ margin-top:16px; padding:10px 24px; border-radius:999px; border:none; background:#3D2B1F; color:#FBF3E7; font-weight:700; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">🧁</div>
    <h1>You're offline</h1>
    <p>Ob-la-moon needs a connection to load new data.<br>Your last saved orders and menu are safe on this device.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
